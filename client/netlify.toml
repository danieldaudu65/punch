# In Netlify set Base directory to "client". Build settings come from this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to the Render server. Status 200 makes this a proxy rather
# than a redirect, so the browser only talks to the Netlify domain and the
# session cookie stays first-party (needed for Safari and phones).
# The same rules are in public/_redirects so they also apply to a manual deploy of dist/.
[[redirects]]
  from = "/api/*"
  to = "https://punch-gonf.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
