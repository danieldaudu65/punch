# Netlify settings for the client. In Netlify, set Base directory to "client".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to the Render server. Status 200 makes this a proxy, not a
# redirect, so the browser only ever talks to the Netlify domain and the
# session cookie stays first-party (needed for Safari and phones).
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RENDER-NAME.onrender.com/api/:splat"
  status = 200
  force = true

# Every other path loads the React app, so refreshing /dashboard works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
