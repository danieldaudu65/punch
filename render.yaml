# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# MONGODB_URI and CLIENT_ORIGIN are asked for during setup; JWT_SECRET is generated.
services:
  - type: web
    name: punch-nextgen-quiz-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (TypeScript) are needed to compile, so include them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY_HOPS
        value: 2
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
